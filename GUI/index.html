<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodexMemory</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <h1 id="appTitle">Memória Visual - Codex</h1>
          <p id="appMode">modo live</p>
        </div>
        <div class="topbar-right">
          <div id="ollamaBadge" class="ollama-badge loading">
            <span class="dot"></span>
            <div class="ollama-meta">
              <strong id="ollamaText">Verificando Ollama...</strong>
              <small id="ollamaModel">Modelo: -</small>
            </div>
          </div>
          <div class="actions">
            <button id="startDaemon">Iniciar</button>
            <button id="stopDaemon">Parar</button>
            <button id="restartDaemon">Reiniciar</button>
            <button id="syncNow">Sync Agora</button>
            <button id="forceMemory">Forcar AGENT_MEMORY</button>
          </div>
        </div>
      </header>
      <section class="status-strip">
        <div id="daemonBadge" class="daemon-badge down">Daemon: parado</div>
        <div id="lastAction" class="last-action">Pronto.</div>
      </section>

      <main class="layout">
        <aside class="panel">
          <section class="card">
            <h2 id="contextsTitle">Contexts</h2>
            <div class="row">
              <button id="newContext">Novo context_n</button>
              <button id="refreshContexts">Atualizar Lista</button>
            </div>
            <ul id="contextList" class="context-list"></ul>
          </section>

          <section class="card">
            <h2 id="contextEditorTitle">Editor de Contexto</h2>
            <div class="row">
              <strong id="currentContext">nenhum selecionado</strong>
              <button id="saveContext">Salvar</button>
            </div>
            <textarea id="contextEditor" placeholder="Conteúdo do contexto..."></textarea>
          </section>

          <section class="card">
            <h2 id="agentMemoryTitle">Agent Memory</h2>
            <div class="row">
              <strong id="agentMemoryLabel">AGENT_MEMORY.md</strong>
              <button id="refreshMemoryView">Atualizar</button>
            </div>
            <textarea id="memoryViewer" readonly placeholder="Carregando memória consolidada..."></textarea>
          </section>
        </aside>

        <section class="void-panel">
          <div class="void-header">
            <h2 id="neuralTitle">Rede Neural</h2>
          </div>
          <div class="void-canvas-wrap">
            <canvas id="voidCanvas"></canvas>
            <button id="centerFoundationBtn" class="canvas-floating-btn" type="button" aria-label="Recentralizar" title="Recentralizar">Recentralizar</button>
            <div id="nodeTooltip" class="node-tooltip" aria-hidden="true"></div>
          </div>
        </section>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
