<!doctype html>
<!-- CodexMemory — Interface visual da rede neural de memória do agente.
     Estrutura: topbar | status strip | layout (sidebar + painel neural canvas).
     Todo o comportamento é controlado por app.js; estilos em styles.css. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodexMemory</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">

      <!-- ===================================================================
           TOPBAR — cabeçalho com título, status do Ollama e controles daemon
           =================================================================== -->
      <header class="topbar">
        <div>
          <h1 id="appTitle">Memória Visual - Codex</h1>
          <p id="appMode">modo live</p>
        </div>
        <div class="topbar-right">
          <div id="ollamaBadge" class="ollama-badge loading">
            <span class="dot"></span>
            <div class="ollama-meta">
              <strong id="ollamaText">Verificando Ollama...</strong>
              <small id="ollamaModel">Modelo: -</small>
            </div>
          </div>
          <!-- Botões de controle do processo daemon e sincronização -->
          <div class="actions">
            <button id="startDaemon">Iniciar</button>
            <button id="stopDaemon">Parar</button>
            <button id="restartDaemon">Reiniciar</button>
            <button id="syncNow">Sync Agora</button>
            <button id="forceMemory">Forcar AGENT_MEMORY</button>
          </div>
        </div>
      </header>
      <!-- ===================================================================
           STATUS STRIP — badge do daemon e última ação executada
           =================================================================== -->
      <section class="status-strip">
        <div id="daemonBadge" class="daemon-badge down">Daemon: parado</div>
        <div id="lastAction" class="last-action">Pronto.</div>
      </section>

      <!-- ===================================================================
           LAYOUT PRINCIPAL — sidebar (esquerda) + painel neural (direita)
           =================================================================== -->
      <main class="layout">

        <!-- Sidebar: lista de contextos, editor e viewer da memória consolidada -->
        <aside class="panel">

          <!-- Card: lista de arquivos context_*.md disponíveis -->
          <section class="card">
            <h2 id="contextsTitle">Contexts</h2>
            <div class="row">
              <button id="newContext">Novo context_n</button>
              <button id="refreshContexts">Atualizar Lista</button>
            </div>
            <ul id="contextList" class="context-list"></ul>
            <p id="contextRefreshNotice" class="context-notice"></p>
          </section>

          <!-- Card: editor de texto do contexto selecionado -->
          <section class="card">
            <h2 id="contextEditorTitle">Editor de Contexto</h2>
            <div class="row">
              <strong id="currentContext">nenhum selecionado</strong>
              <button id="saveContext">Salvar</button>
            </div>
            <textarea id="contextEditor" placeholder="Conteúdo do contexto..."></textarea>
          </section>

          <!-- Card: viewer readonly do AGENT_MEMORY.md consolidado -->
          <section class="card">
            <h2 id="agentMemoryTitle">Agent Memory</h2>
            <div class="row">
              <strong id="agentMemoryLabel">AGENT_MEMORY.md</strong>
              <button id="refreshMemoryView">Atualizar</button>
            </div>
            <textarea id="memoryViewer" readonly placeholder="Carregando memória consolidada..."></textarea>
          </section>
        </aside>

        <!-- Painel neural: canvas 2D com visualização da rede de memória.
             O neurônio fundamento (context_1.md) fica sempre centralizado e imóvel.
             Os demais neurônios flutuam com animação idle configurada em config.json. -->
        <section class="void-panel">
          <div class="void-header">
            <div class="void-header-top">
              <h2 id="neuralTitle">Rede Neural</h2>
              <label class="area-switch" for="toggleAreaLabels">
                <input id="toggleAreaLabels" type="checkbox" checked />
                <span class="slider" aria-hidden="true"></span>
                <span id="toggleAreaLabelsText">Mostrar Areas</span>
              </label>
            </div>
          </div>
          <div class="void-canvas-wrap">
            <!-- Canvas do grafo neural — dimensionado por JS em resizeCanvas() -->
            <canvas id="voidCanvas"></canvas>
            <!-- Botão flutuante para recentrar câmera no neurônio fundamento -->
            <button id="centerFoundationBtn" class="canvas-floating-btn" type="button" aria-label="Recentralizar" title="Recentralizar">Recentralizar</button>
            <!-- Tooltip exibido ao hover de um neurônio — aria-hidden controlado por JS -->
            <div id="nodeTooltip" class="node-tooltip" aria-hidden="true"></div>
          </div>
        </section>
      </main>
    </div>
    <!-- app.js carrega config.json → i18n → grafo → inicia loop de animação -->
    <script src="./app.js"></script>
  </body>
</html>
